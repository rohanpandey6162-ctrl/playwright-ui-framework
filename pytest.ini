[pytest]
markers =
    smoke: quick, high-priority checks that should pass before any deeper testing
    regression: broader coverage run to catch regressions across the app
    login: tests covering the login page and authentication behavior
    cart: tests covering cart and checkout behavior

addopts =
    -v
    --strict-markers
    --html=reports/report.html
    --self-contained-html

testpaths = tests
